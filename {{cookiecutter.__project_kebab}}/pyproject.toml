[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "{{cookiecutter.__project_kebab}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author_full_name}} <{{cookiecutter.author_email}}>" }]
requires-python = ">=3.14,<4.0"


dependencies = [
    # Server deps
    "aiohttp>=3.10,<4",
    "fastapi>=0.140.1,<1",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "sentry-sdk>=2.66.1,<3",
    "starlette-exporter>=0.23.0,<1",
    "typer>=0.27.0,<1",
    "uvicorn>=0.51.0,<1",
    "uvloop>=0.22.1,<1",
    # Tracing. No exporter is configured (see {{cookiecutter.__project_slug}}/telemetry.py):
    # spans are created purely so their trace/span ids can be attached to logs.
    "opentelemetry-sdk>=1.29.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # Propagates trace context into outbound aiohttp client requests (injects
    # the W3C traceparent header on every ClientSession call).
    "opentelemetry-instrumentation-aiohttp-client>=0.50b0",
]


[project.scripts]
{{cookiecutter.__project_kebab}} = "{{cookiecutter.__project_slug}}.cli:app"


[dependency-groups]
test = [
    "coverage>=7.15.2",
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
]
lint = [
    "black>=26.5.1",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411,<2",
    "ruff>=0.16.0",
]


[[tool.uv.index]]
name = "distribusion"
url = "https://gitlab.com/api/v4/groups/15793598/-/packages/pypi/simple"
explicit = true


[tool.coverage.run]
source = ["{{cookiecutter.__project_slug}}"]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
